name: Libra
options:
  bundleIdPrefix: com.redpax
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru

settings:
  base:
    DEVELOPMENT_TEAM: V6KX6679UL
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"

targets:
  Libra:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    entitlements:
      path: Libra.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.redpax.Libra
        PRODUCT_NAME: Libra
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Своего шифрования в приложении нет — без этого ключа TestFlight
        # спрашивает про экспортное соответствие у каждой сборки.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: QN Scale
        # Иначе системные элементы (например, выбор даты) остаются на английском
        INFOPLIST_KEY_CFBundleDevelopmentRegion: ru
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Приложение соединяется с напольными весами по Bluetooth, чтобы прочитать вес.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Вес и состав тела записываются в «Здоровье», чтобы данными могли пользоваться другие приложения.
        INFOPLIST_KEY_NSHealthShareUsageDescription: Доступ к «Здоровью» нужен, чтобы не дублировать уже записанные измерения.
